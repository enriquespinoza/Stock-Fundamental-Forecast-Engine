[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-fundamental-forecast-engine"
version = "0.1.0"
description = "Point-in-time SEC research foundation for stock return forecasting"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
market-data = [
    "yfinance==1.7.0",
    "exchange-calendars==4.13.2",
]
timesfm = [
    "timesfm[torch]==2.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

